# Ewinet Route Monitor - Configuracion de Diagnostico Local
# ===========================================================
# Ejecutar desde tu PC detras de MikroTik.
# La app detecta tu IP publica y te muestra las rutas completas.

general:
  poll_interval_seconds: 120        # Intervalo entre ciclos (modo daemon)
  mtr_cycles: 10                    # Ciclos de probe MTR por test
  mtr_max_hops: 30                  # Max saltos MTR
  alert_cooldown_seconds: 300       # Tiempo minimo entre alertas duplicadas
  log_level: INFO                   # DEBUG, INFO, WARNING, ERROR
  data_retention_days: 7            # Dias de retencion de datos
  enable_mikrotik: false            # Deshabilitado - tu gestionas MikroTik
  enable_telegram: false            # Deshabilitado - diagnostico local

# Destinos de prueba - la app hace traceroute a cada uno
# desde tu PC y muestra la ruta AS completa.
# La app detecta automaticamente por que ASN estas saliendo.
destinations:
  - destination: "8.8.8.8"
    description: "Google DNS"

  - destination: "1.1.1.1"
    description: "Cloudflare DNS"

  - destination: "208.67.222.222"
    description: "OpenDNS"

# Baselines opcionales - si no se configuran, la app aprende
# la ruta en la primera ejecucion y la usa como referencia.
# Descomenta y ajusta segun tus rutas esperadas:
#
# baselines:
#   "8.8.8.8":
#     expected_as_path: [10929, 3356, 15169]
#     known_transit_asns: [3356, 174, 1299]
#     expected_first_hop_asn: 3356
#     baseline_rtt_avg: 65.0

