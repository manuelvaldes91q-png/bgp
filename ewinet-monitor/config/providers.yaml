# Ewinet Route Monitor - Configuracion de Proveedores (Diagnostico Local)
# ========================================================================
# Ejecutar desde tu PC para diagnosticar rutas de tus proveedores ISP.
# Los cambios en MikroTik (rutas estaticas) los haces manualmente.

general:
  poll_interval_seconds: 120        # Intervalo entre ciclos de monitoreo
  mtr_cycles: 10                    # Ciclos de probe MTR por test
  mtr_max_hops: 30                  # Max saltos MTR
  alert_cooldown_seconds: 300       # Tiempo minimo entre alertas duplicadas
  log_level: INFO                   # DEBUG, INFO, WARNING, ERROR
  data_retention_days: 7            # Dias de retencion de datos historicos
  enable_mikrotik: false            # Deshabilitado - tu gestionas MikroTik
  enable_telegram: false            # Deshabilitado - diagnostico local

providers:
  - name: Inter
    asn: 10929
    gateway: ""                     # Sin source IP - se hace traceroute desde tu PC
    local_interface: "ether2"
    vlan_id: "100"
    test_destinations:
      - "8.8.8.8"
      - "1.1.1.1"
      - "208.67.222.222"
    baseline:
      expected_as_path: [10929, 3356, 15169]
      known_transit_asns: [3356, 174, 1299, 6453, 3257]
      expected_first_hop_asn: 3356
      baseline_rtt_avg: 65.0
    description: "Upstream primario - Inter (AS10929)"

  - name: Digitel
    asn: 15135
    gateway: ""
    local_interface: "ether3"
    vlan_id: "200"
    test_destinations:
      - "8.8.8.8"
      - "1.1.1.1"
      - "208.67.222.222"
    baseline:
      expected_as_path: [15135, 1299, 15169]
      known_transit_asns: [1299, 3356, 174, 2914]
      expected_first_hop_asn: 1299
      baseline_rtt_avg: 70.0
    description: "Upstream secundario - Digitel (AS15135)"

  - name: Besser
    asn: 263220
    gateway: ""
    local_interface: "ether4"
    vlan_id: "300"
    test_destinations:
      - "8.8.8.8"
      - "1.1.1.1"
      - "208.67.222.222"
    baseline:
      expected_as_path: [263220, 174, 15169]
      known_transit_asns: [174, 3356, 1299, 6453]
      expected_first_hop_asn: 174
      baseline_rtt_avg: 80.0
    description: "Upstream terciario - Besser (AS263220)"

# Registro de ASN para output legible
asn_registry:
