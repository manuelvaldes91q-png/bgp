# Ewinet Route Monitor - Provider Configuration
# ================================================
# Configure your upstream providers, test destinations, and expected baselines.
# The monitor will compare live routes against these baselines to detect anomalies.

general:
  poll_interval_seconds: 300        # How often to run the full monitoring cycle
  mtr_cycles: 10                    # Number of MTR probe cycles per test
  mtr_max_hops: 30                  # Maximum hops for MTR
  alert_cooldown_seconds: 600       # Minimum time between duplicate alerts
  log_level: INFO                   # DEBUG, INFO, WARNING, ERROR
  data_retention_days: 30           # How long to keep historical data
  enable_mikrotik: true             # Enable MikroTik integration
  enable_telegram: true             # Enable Telegram alerts

providers:
  - name: Inter
    asn: 10929
    gateway: "10.0.0.1"             # Next-hop IP from your router
    local_interface: "ether2"       # Physical interface or VLAN on MikroTik
    vlan_id: "100"
    test_destinations:
      - "8.8.8.8"
      - "1.1.1.1"
      - "208.67.222.222"
    baseline:
      expected_as_path: [10929, 3356, 15169]
      known_transit_asns: [3356, 174, 1299, 6453, 3257]
      expected_first_hop_asn: 3356
      baseline_rtt_avg: 65.0
    description: "Primary upstream - Inter (AS10929)"

  - name: Digitel
    asn: 15135
    gateway: "172.16.0.1"
    local_interface: "ether3"
    vlan_id: "200"
    test_destinations:
      - "8.8.8.8"
      - "1.1.1.1"
      - "208.67.222.222"
    baseline:
      expected_as_path: [15135, 1299, 15169]
      known_transit_asns: [1299, 3356, 174, 2914]
      expected_first_hop_asn: 1299
      baseline_rtt_avg: 70.0
    description: "Secondary upstream - Digitel (AS15135)"

  - name: Besser
    asn: 263220
    gateway: "192.168.1.1"
    local_interface: "ether4"
    vlan_id: "300"
    test_destinations:
      - "8.8.8.8"
      - "1.1.1.1"
      - "208.67.222.222"
    baseline:
      expected_as_path: [263220, 174, 15169]
      known_transit_asns: [174, 3356, 1299, 6453]
      expected_first_hop_asn: 174
      baseline_rtt_avg: 80.0
    description: "Tertiary upstream - Besser (AS263220)"

